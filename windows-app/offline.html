<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Andam — offline</title>
<style>
  html,body{height:100%;margin:0;background:#0A0B0F;color:#F4F5F7;font-family:"Segoe UI",system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  img{width:120px;height:120px;border-radius:28px}
  h1{font-size:22px;margin:8px 0 0}
  p{color:#A3A6B0;margin:0;max-width:420px;line-height:1.5}
  button{margin-top:10px;background:#FF3B4E;color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div class="wrap">
  <img src="build/icon.png" alt="" />
  <h1>No connection</h1>
  <p>Andam could not reach ip.andam.uk. Check your internet connection, then try again.</p>
  <button id="retry">Try again</button>
</div>
<script>
  const u = new URLSearchParams(location.search).get('u') || 'https://ip.andam.uk/';
  const target = /^https:\/\//.test(u) ? u : 'https://ip.andam.uk/';
  const go = () => { location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
</script>
</body>
</html>
