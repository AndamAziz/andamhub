# Andam Player keys. ▲ / ▼ (and Page Up / Page Down) change channel on live TV;
# on films the Andam window turns them into a 1-minute jump.
UP          script-message andam-prev
DOWN        script-message andam-next
PGUP        script-message andam-prev
PGDWN       script-message andam-next
ENTER       cycle fullscreen
f           cycle fullscreen
MBTN_LEFT_DBL cycle fullscreen
ESC         set fullscreen no
SPACE       cycle pause
MBTN_LEFT   cycle pause
LEFT        seek -10
RIGHT       seek 10
a           cycle audio
s           cycle sub
m           cycle mute
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5
