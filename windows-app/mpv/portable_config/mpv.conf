# Andam Player (mpv) — tuned for live TV, movies and series.
title="${media-title} — Andam Player"
force-window=immediate
keep-open=no
# Stay open between streams: the Andam window loads the next channel / episode into it.
idle=yes
autofit-larger=90%x90%
geometry=50%:50%
background-color='#0A0B0F'

# Picture: hardware decoding when safe (falls back to software automatically).
hwdec=auto-safe

# Sound: every format (AC3, E-AC3, DTS, TrueHD) decoded here; 5.1 is mixed down for speakers.
audio-channels=auto-safe
volume=100
volume-max=150

# Network: a comfortable buffer and automatic reconnects for live streams.
cache=yes
cache-secs=120
demuxer-max-bytes=256MiB
# Keep what was already played (~10 minutes of a typical channel) so live TV can be paused and
# rewound inside it; seeking inside that cache works even on live streams that cannot seek.
demuxer-max-back-bytes=384MiB
demuxer-seekable-cache=yes
force-seekable=yes
demuxer-readahead-secs=60
network-timeout=20
# Keep one HTTP connection open and reuse it for every jump inside a file (badly interleaved
# MP4s jump between the picture and the sound all the time); follow redirects once.
# Reconnect on dropped connections, network errors and server (5xx) hiccups, then carry on
# from the same point.
# Network through FFmpeg, not mpv's newer libcurl backend (on by default since late 2026 builds):
# curl cannot reconnect a live stream (non-seekable transfers are never retried) and always sends
# "Range: 0-", and it ignores the stream-lavf-o settings below and in main.js.
curl-enabled=no
# Seeking is detected from the server's reply (a forced "seekable" broke films on servers that
# answer a jump with the whole file); live streams are opened without a Range header (main.js).
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_on_network_error=1,reconnect_on_http_error=5xx,reconnect_delay_max=5,multiple_requests=1
# HLS: current FFmpeg refuses playlist parts whose address has no usual file extension
# ("not in allowed_segment_extensions"); the Andam relay's parts (/api/public/xtream-play?s=1…)
# and many providers' token / .php parts have none, so every such m3u8 failed. Accept them.
demuxer-lavf-o=extension_picky=0
# The user agent IPTV panels accept (the Andam server uses the same one towards providers).
user-agent="VLC/3.0.20 LibVLC/3.0.20"

# On-screen controls and messages.
osc=yes
osd-bar=yes
osd-font='Segoe UI'
osd-font-size=30
osd-duration=1600
screenshot-directory=~~desktop/
ytdl=no
