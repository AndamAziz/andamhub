# Andam Player (mpv) — tuned for live TV, movies and series.
title="${media-title} — Andam Player"
force-window=immediate
keep-open=no
# Stay open between streams: the Andam window loads the next channel / episode into it.
idle=yes
autofit-larger=90%x90%
geometry=50%:50%
background-color='#0A0B0F'

# Picture: hardware decoding when safe (falls back to software automatically).
hwdec=auto-safe

# Sound: every format (AC3, E-AC3, DTS, TrueHD) decoded here; 5.1 is mixed down for speakers.
audio-channels=auto-safe
volume=100
volume-max=150

# Network: a comfortable buffer and automatic reconnects for live streams.
cache=yes
cache-secs=120
demuxer-max-bytes=256MiB
# Keep what was already played (~10 minutes of a typical channel) so live TV can be paused and
# rewound inside it; seeking inside that cache works even on live streams that cannot seek.
demuxer-max-back-bytes=384MiB
demuxer-seekable-cache=yes
force-seekable=yes
demuxer-readahead-secs=60
network-timeout=20
# Keep one HTTP connection open and reuse it for every jump inside a file (badly interleaved
# MP4s jump between the picture and the sound all the time); follow redirects once.
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5,multiple_requests=1,seekable=1
user-agent="AndamDesktop/1.0"

# On-screen controls and messages.
osc=yes
osd-bar=yes
osd-font='Segoe UI'
osd-font-size=30
osd-duration=1600
screenshot-directory=~~desktop/
ytdl=no
