name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            [ -x "$c" ] && SDKMANAGER="$c" && break
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, skipping license accept"
          fi

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx --yes cap add android
          npx --yes cap sync android

      - name: Set version
        working-directory: android-app/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          chmod +x gradlew

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            CLEAN_KEY="$(printf '%s' "$KEYSTORE_BASE64" | sed 's#^data:[^,]*;base64,##' | tr -d '[:space:]')"

            if ! printf '%s' "$CLEAN_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              rm -f "$RUNNER_TEMP/release.jks"
              echo "::error title=Invalid Android keystore Base64::ANDROID_KEYSTORE_BASE64 is not valid Base64. Replace it with the complete Base64 output of your real andam.jks file; do not paste a path or command."
              exit 1
            fi

            if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error title=Empty Android keystore::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
              exit 1
            fi

            if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error title=Missing Android signing secret::ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must both be set."
              exit 1
            fi

            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error title=Android keystore could not be opened::Check that the Base64 came from the correct andam.jks file and that ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS match it."
              exit 1
            fi

            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK + AAB
        if: steps.sign.outputs.signed == 'true'
        working-directory: android-app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build debug APK + unsigned AAB (no key set)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android-app/android
        run: ./gradlew assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: andam-apk
          path: android-app/android/app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: andam-aab
          path: android-app/android/app/build/outputs/bundle/**/*.aab
