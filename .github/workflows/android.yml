name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version
        working-directory: android-app/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          chmod +x gradlew

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APK + AAB
        if: steps.sign.outputs.signed == 'true'
        working-directory: android-app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build debug APK + unsigned AAB (no key set)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android-app/android
        run: ./gradlew assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: andam-apk
          path: android-app/android/app/build/outputs/apk/**/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: andam-aab
          path: android-app/android/app/build/outputs/bundle/**/*.aab
