name: Build Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            [ -x "$c" ] && SDKMANAGER="$c" && break
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager not found, skipping license accept"
          fi

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx --yes cap add android
          npx --yes cap sync android

      - name: Set version
        working-directory: android-app/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          chmod +x gradlew

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_PASS="${KS_PASS:-andam-store-pass}"
          KEY_ALIAS="${KEY_ALIAS:-andam}"
          KEY_PASS="${KEY_PASS:-$KS_PASS}"
          VALID=0

          if [ -n "$KEYSTORE_BASE64" ]; then
            CLEAN_KEY="$(printf '%s' "$KEYSTORE_BASE64" | sed 's#^data:[^,]*;base64,##' | tr -d '[:space:]')"
            if printf '%s' "$CLEAN_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null \
               && [ -s "$RUNNER_TEMP/release.jks" ] \
               && keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              VALID=1
              echo "Using keystore from ANDROID_KEYSTORE_BASE64"
            else
              rm -f "$RUNNER_TEMP/release.jks"
              echo "::warning title=Keystore secret invalid::ANDROID_KEYSTORE_BASE64 could not be used; generating a fresh keystore instead."
            fi
          fi

          if [ "$VALID" -eq 0 ]; then
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Andam, OU=Andam, O=Andam, L=NA, ST=NA, C=UK"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "store_pass=$KS_PASS" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Build signed APK + AAB
        working-directory: android-app/android
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="${{ steps.sign.outputs.store_pass }}" \
            -Pandroid.injected.signing.key.alias="${{ steps.sign.outputs.key_alias }}" \
            -Pandroid.injected.signing.key.password="${{ steps.sign.outputs.key_pass }}"

      - name: Prepare release downloads
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/release/app-release.apk \
            release-files/Andam-${{ github.run_number }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab \
            release-files/Andam-${{ github.run_number }}.aab
          if [ "${{ steps.sign.outputs.generated }}" = "true" ]; then
            cp "$RUNNER_TEMP/release.jks" release-files/Andam-signing-key.jks
          fi

      - name: Publish APK and AAB in Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-build-${{ github.run_number }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release-files/* \
            --title "Andam Android build ${{ github.run_number }}" \
            --notes "Signed Android APK and AAB generated from commit ${{ github.sha }}."
