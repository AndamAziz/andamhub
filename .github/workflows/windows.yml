name: Build Windows (EXE)

on:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  # Pull requests build the installer as a check; only pushes to main publish it.
  pull_request:
    paths:
      - "windows-app/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Set version 1.0.${{ github.run_number }}
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Bundle Andam Player (mpv)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/get-player.js
          ls -la mpv || true

      # Plays real streams with the bundled player and OUR config (portable_config), so a
      # broken mpv.conf / FFmpeg change is caught here instead of on viewers' PCs.
      # Required: an MP4 file (played and sought), HLS through the Andam relay (extension-less
      # parts) and a public HLS playlist. Live MPEG-TS via the relay is reported only (third-party).
      - name: Smoke-test Andam Player (mp4, m3u8, relay)
        if: hashFiles('windows-app/mpv/AndamPlayer.exe') != ''
        shell: bash
        run: |
          # Collect every result first (no exit on the first failing command).
          set +e +o pipefail
          P=./mpv/AndamPlayer.exe
          "$P" --version > ver.txt 2>&1; head -1 ver.txt
          play() { # name required url [extra mpv options]
            local name="$1" req="$2" url="$3"; shift 3
            # CI runners have no GPU: software decoding; stop after 120 decoded frames.
            timeout 90 "$P" --idle=no --force-window=no --vo=null --ao=null --hwdec=no --frames=120 \
              --network-timeout=25 --msg-level=all=warn,cplayer=info "$@" "$url" > log.txt 2>&1
            local rc=$?
            if [ $rc -eq 0 ] && ! grep -qiE "Failed to open|failed to recognize|not in allowed|Unexpected offset|Errors when loading file" log.txt; then
              echo "OK   $name"; return 0
            fi
            echo "FAIL $name (exit $rc)"; tail -40 log.txt
            if [ "$req" = "yes" ]; then FAILED=1; else echo "::warning::$name did not play (third-party stream)"; fi
          }
          FAILED=0
          # Our settings must be the ones in use (mpv reads portable_config next to the exe).
          timeout 60 "$P" -v --idle=no --force-window=no --vo=null --ao=null --hwdec=no --frames=1 \
            "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4" > cfg.txt 2>&1
          if grep -i "portable_config" cfg.txt | grep -qi "mpv.conf"; then
            echo "OK   portable_config/mpv.conf is loaded"
          else
            echo "FAIL portable_config/mpv.conf was not loaded"; head -60 cfg.txt; FAILED=1
          fi
          tok() { curl -sS "https://ip.andam.uk/api/public/iptv?action=play&source=andam&id=$1" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).token||'')}catch(e){}})"; }
          play "MP4 file" yes "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4"
          play "MP4 file, sought to 0:05" yes "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4" --start=5 --frames=60
          play "HLS via the Andam relay" yes "https://ip.andam.uk/api/public/xtream-play?t=$(tok 1)"
          play "Public HLS playlist" yes "https://hlspackager.akamaized.net/live/DB/AVA_TV/HLS/AVA_TV.m3u8"
          play "Live MPEG-TS via the relay" no "https://ip.andam.uk/api/public/xtream-play?t=$(tok 51)" --stream-lavf-o-append=seekable=0
          exit $FAILED

      - name: Build installer (Andam-Setup.exe)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never

      # One rolling pre-release holds the newest installer + latest.yml for auto-update.
      # It is marked pre-release so the Android app's "releases/latest" check never sees it.
      - name: Publish to the "windows-latest" release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -la
          gh release delete windows-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create windows-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Andam for Windows 1.0.${{ github.run_number }}" \
            --notes "Download **Andam-Setup.exe** below and run it. Windows may show \"Windows protected your PC\": click **More info** → **Run anyway**. The app updates itself after that." \
            Andam-Setup.exe Andam-Setup.exe.blockmap latest.yml
